name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: one-linux-x86_64
            bin: one
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: one-linux-aarch64
            bin: one
          - os: macos-13
            target: x86_64-apple-darwin
            asset: one-macos-x86_64
            bin: one
          - os: macos-14
            target: aarch64-apple-darwin
            asset: one-macos-aarch64
            bin: one
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: one-windows-x86_64.exe
            bin: one.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/one-web/web/package-lock.json

      - name: Build Web UI
        working-directory: crates/one-web/web
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release --locked -p one-cli --bin one --target ${{ matrix.target }}

      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist-artifacts/${{ matrix.asset }}"
          chmod +x "dist-artifacts/${{ matrix.asset }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-artifacts/${{ matrix.asset }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare install script and SHA256SUMS
        run: |
          cp scripts/install.sh release-assets/install.sh
          cd release-assets
          sha256sum one-* install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/one-*
            release-assets/install.sh
            release-assets/SHA256SUMS
