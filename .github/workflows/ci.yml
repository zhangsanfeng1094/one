name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/one-web/web/package-lock.json
      - name: Build Web UI
        working-directory: crates/one-web/web
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Core lint gate
        run: cargo clippy -p one-core --all-targets -- -D warnings
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Build release binary
        run: cargo build -p one-cli --release
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-linux-x86_64
          path: target/release/one
